<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PGWEB ACARA 5 | GEOJSON</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <style>
        html,
        body,
        #map {
            width: 100%;
            height: 100%;
            margin: 0;
        }
    </style>
</head>

<body>
    <div id="map"></div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script>
        // Inisialisasi peta
        var map = L.map("map").setView([-8.341896, 122.987972], 11);

        // Tile Layer Base Map
        var basemap = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            attribution:
                '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        });

        // Menambahkan basemap ke dalam peta
        basemap.addTo(map);

        // GeoJSON Point Sarana Prasarana
        var toponimi = L.geoJSON(null, {
            // Style
            pointToLayer: function (feature, latlng) {
                return L.marker(latlng, {
                    icon: L.icon({
                        iconUrl: "image/home_marker.png", // icon marker
                        iconSize: [30, 30], // ukuran icon
                        iconAnchor: [24, 48], // posisi icon terhadap titik (point)
                        popupAnchor: [0, -48], // posisi popup terhadap icon
                        tooltipAnchor: [-16, -30], // posisi tooltip terhadap icon
                    }),
                });
            },
            // onEachFeature
            onEachFeature: function (feature, layer) {
                // variable popup content
                var popup_content =
                    "Nama: " + feature.properties.nama + "<br>" +
                    "Koordinat: " + feature.geometry.coordinates[1] + ", " + feature.geometry.coordinates[0] + "<br>" +
                    "<img src= 'images/image/gunung-ile-lewero.jpg" + feature.properties.image + " 'alt=' 'width='50' height='50'>";

                layer.on({
                    click: function (e) {
                        toponimi.bindPopup(popup_content);
                    },
                    mouseover: function (e) {
                        toponimi.bindTooltip(feature.properties.TOPONIMI, {
                            direction: "left",
                            sticky: true,
                        });
                    },
                });

            },
        });

        // GeoJSON Polyline Jalan
        var jalan = L.geoJSON(null, {
            style: function (feature) {
                return {
                    color: "red",
                    opacity: 1,
                    weight: 3,
                };
            },
            onEachFeature: function (feature, layer) {
                // variable popup content
                var popup_content = "Fungsi: " + feature.properties.fungsi + "<br>" +
                    "Panjang (m): " + feature.properties.panjang_m;

                layer.on({
                    click: function (e) {
                        jalan.bindPopup(popup_content);
                    },
                    mouseover: function (e) {
                        jalan.bindTooltip(feature.properties.fungsi, {
                            direction: "left",
                            sticky: true,
                        });
                    },
                });
            },
        });


        // GeoJSON Polygon Jumlah Penduduk
        var jumlah_penduduk = L.geoJSON(null, {
            // Style
            style: function (feature) {
                return {
                    color: "gray",
                    opacity: 1,
                    weight: 1,
                    fillColor: "#a9a9a9",
                    fillOpacity: 0.4,
                };
            },

            // onEachFeature
            onEachFeature: function (feature, layer) {
                // variable popup content
                var popup_content = "Kecamatan: " + feature.properties.WADMKC + "<br>" +
                    "Jumlah Penduduk: " + feature.properties.jumlah_penduduk;

                layer.on({
                    click: function (e) {
                        jumlah_penduduk.bindPopup(popup_content);
                    },
                    mouseover: function (e) {
                        jumlah_penduduk.bindTooltip(feature.properties.WADMKC, {
                            direction: "left",
                            sticky: true,
                        });
                    },
                });
            },

        });
        $.getJSON("geojson/jalan.geojson", function (data) {
            jalan.addData(data);
            map.addLayer(jalan);
        });


        $.getJSON("geojson/toponimi.geojson", function (data) {
            toponimi.addData(data); // Menambahkan data ke dalam GeoJSON Point Sarana Prasarana
            map.addLayer(toponimi); // Menambahkan GeoJSON Point Sarana Prasarana ke dalam peta
        });

        $.getJSON("geojson/jumlah_penduduk.geojson", function (data) {
            jumlah_penduduk.addData(data); // Menambahkan data ke dalam GeoJSON Polygon Jumlah Penduduk
            map.addLayer(jumlah_penduduk); // Menambahkan GeoJSON Polygon Jumlah Penduduk ke dalam peta
        });


        // Control Layer
        var baseMaps = {
            "OpenStreetMap": osm,
        };

        var overlayMaps = {
            "Toponimi": toponimi,
            "Jalan": jalan,
            "Jumlah Penduduk": jumlah_penduduk
        };

        var controllayer = L.control.layers(baseMaps, overlayMaps);
        controllayer.addTo(map);
    </script>
</body>

</html>
